# Ambiente de desenvolvimento local: MySQL 8 + Adminer
# Uso: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: promosys-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # Timezone fixa em UTC: a API grava e lê sempre em UTC (ver docs/arquitetura.md)
      - --default-time-zone=+00:00
      - --max-connections=300
      - --innodb-buffer-pool-size=512M
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: promosys
      MYSQL_USER: promosys
      MYSQL_PASSWORD: promosys
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-proot']
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: promosys-adminer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - '8080:8080'

volumes:
  mysql-data:
